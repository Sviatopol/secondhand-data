name: Update secondhands data

on:
  schedule:
    - cron: '0 3 * * *'  # щодня о 3:00 UTC (6:00 Київ)
  workflow_dispatch:  # можна запустити вручну

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread requests

      - name: Write credentials
        run: echo '${{ secrets.GOOGLE_CREDS }}' > creds.json

      - name: Run export script
        run: python export_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo $(date +%Y%m%d%H%M%S) > data/version.txt
          git add data/secondhands.json data/version.txt
          git diff --staged --quiet || git commit -m "Update data"
          git push
